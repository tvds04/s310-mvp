  <main id="main" class="page-wrap">
    <h1 class="page-title">Submit Student Application</h1>
    <p class="page-subtitle">Apply to participate in Project Future. Fields marked with an asterisk are required.</p>

    <form class="card" action="#" method="post" enctype="multipart/form-data">
      <div class="form-grid">
        <div class="form-row">
          <label for="first-name" class="required">First Name</label>
          <input type="text" id="first-name" name="first_name" required autocomplete="given-name">
        </div>
        <div class="form-row">
          <label for="last-name" class="required">Last Name</label>
          <input type="text" id="last-name" name="last_name" required autocomplete="family-name">
        </div>
        <div class="form-row">
          <label for="student-email" class="required">Email</label>
          <input type="email" id="student-email" name="email" required autocomplete="email">
        </div>
        <div class="form-row">
          <label for="class-standing" class="required">Class Standing</label>
          <select id="class-standing" name="class_standing" required>
            <option value="">— Select —</option>
            <option value="freshman">Freshman</option>
            <option value="sophomore">Sophomore</option>
            <option value="junior">Junior</option>
            <option value="senior">Senior</option>
            <option value="grad">Grad</option>
          </select>
        </div>
        <div class="form-row">
          <label for="major" class="required">Major</label>
          <select id="major" name="major" required>
            <option value="">— Select —</option>
            <option value="accounting">Accounting</option>
            <option value="finance">Finance</option>
            <option value="information-systems">Information Systems</option>
          </select>
        </div>
        <div class="form-row">
          <label for="resume" class="required">Upload resume</label>
          <input type="file" id="resume" name="resume" required accept=".pdf,application/pdf">
          <p class="hint">PDF only.</p>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </main>
